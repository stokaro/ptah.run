name: Deploy

on:
  push:
    branches: [main]
  # The checks below are what keeps a generated page from drifting from the
  # data it is generated out of, and a pull request is where that is worth
  # knowing. Only the check job runs here; deploy is guarded below, because a
  # pull request must not publish.
  pull_request:
    branches: [main]
  # Re-stamp the release version into the pages a few times a day, so the
  # value a visitor gets when the GitHub API is unreachable is recent.
  schedule:
    - cron: "17 */6 * * *"
  # stokaro/ptah asks for a deploy at the two moments the pages depend on it:
  # `ptah-release` when a release is published (the version stamp), and
  # `installers-updated` when install.sh or install.ps1 change on master.
  # By hand: `gh api repos/stokaro/ptah.run/dispatches -f event_type=ptah-release`.
  repository_dispatch:
    types: [ptah-release, installers-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The pages are what Astro writes, so every check reads dist/. The
      # version is the committed one: a pull request is checked against what
      # it commits, and the deploy below builds again with the live release.
      - name: Build the site
        run: npm run build

      - name: All language trees match their source, links and metadata
        run: npm run check

      # A build with a release passed in names that release on every page,
      # and nothing else.
      - name: The release version reaches every page
        run: |
          set -euo pipefail
          PTAH_VERSION=v9.9.9 npm run build
          PTAH_VERSION=v9.9.9 node scripts/check-locales.mjs
          ! grep -rl --include='*.html' -E 'data-version>v0\.' dist/ || { echo "::error::a page kept the committed version"; exit 1; }
          if PTAH_VERSION=9.9.9 npm run build 2>/dev/null; then echo "::error::a malformed PTAH_VERSION was accepted"; exit 1; fi
          npm run build

      - run: npx playwright install --with-deps chromium

      - name: Check layout and interactions in every language
        run: npm run check:browser

      - name: Keep the localization screenshots and layout readings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-browser-checks
          path: artifacts/locales/
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The pages leave the build naming the latest release. Ask GitHub for it
      # and build with it, so a browser that cannot reach the API still sees a
      # recent version. When this lookup fails, the committed value in
      # src/data/release.json stays: a stale number is better than a missed
      # deploy.
      - name: Build with the latest Ptah release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="$(gh api repos/stokaro/ptah/releases/latest --jq .tag_name 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            export PTAH_VERSION="$tag"
          else
            echo "::warning::could not read the latest stokaro/ptah release; building with the committed version"
          fi
          set -e
          npm run build

      # https://ptah.run/install.sh and /install.ps1 are the installers from the
      # master branch of stokaro/ptah (docs/site/public/). They are not kept in
      # this repository: every deploy fetches them, so the site never serves a
      # copy that drifted from the source. A failed fetch fails the deploy and
      # leaves the previous deployment, installers included, in place.
      - name: Fetch the installers from stokaro/ptah master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in install.sh install.ps1; do
            gh api "repos/stokaro/ptah/contents/docs/site/public/$f?ref=master" \
              -H "Accept: application/vnd.github.raw+json" > "dist/$f"
            test "$(wc -c < "dist/$f")" -gt 4096
            grep -q "PTAH_INSTALL" "dist/$f"
          done
          head -1 dist/install.sh | grep -qx '#!/bin/sh'
          sh -n dist/install.sh
          ls -la dist/install.sh dist/install.ps1

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
