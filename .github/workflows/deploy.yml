name: Deploy

on:
  push:
    branches: [main]
  # The checks below are what keeps a generated page from drifting from the
  # data it is generated out of, and a pull request is where that is worth
  # knowing. Only the check job runs here; deploy is guarded below, because a
  # pull request must not publish.
  pull_request:
    branches: [main]
  # Re-stamp the release version into the pages a few times a day, so the
  # value a visitor gets when the GitHub API is unreachable is recent.
  schedule:
    - cron: "17 */6 * * *"
  # stokaro/ptah asks for a deploy at the two moments the pages depend on it:
  # `ptah-release` when a release is published (the version stamp), and
  # `installers-updated` when install.sh or install.ps1 change on master.
  # By hand: `gh api repos/stokaro/ptah.run/dispatches -f event_type=ptah-release`.
  repository_dispatch:
    types: [ptah-release, installers-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Every page references files that exist
        run: |
          set -euo pipefail
          status=0
          for page in index.html install/index.html 404.html in-practice/index.html; do
            grep -oE '(href|src)="/[^"#?]+' "$page" | sed -E 's/^(href|src)="\///' | sort -u | while read -r path; do
              # Directory links resolve to their index.html.
              if [ -d "$path" ] && [ -f "$path/index.html" ]; then continue; fi
              if [ ! -f "$path" ]; then
                echo "::error file=$page::references /$path, which does not exist"
                exit 1
              fi
            done || status=1
          done
          exit "$status"

      - name: CNAME names the production domain
        run: test "$(tr -d '[:space:]' < CNAME)" = "ptah.run"

      - name: No github.io address on the pages
        run: |
          if grep -n "github\.io" index.html install/index.html 404.html in-practice/index.html; then
            echo "::error::the pages must use ptah.run addresses, never github.io"
            exit 1
          fi

      - name: The in-practice page and the home transcript match assets/runs.js
        run: node scripts/build-runs.mjs --check

      - name: The version stamp works on a copy of the pages
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R index.html install 404.html in-practice scripts "$tmp/"
          (cd "$tmp" && node scripts/stamp-version.mjs v9.9.9 && node scripts/stamp-version.mjs v9.9.9 --check)
          ! (cd "$tmp" && node scripts/stamp-version.mjs v0.0.1 --check) || { echo "::error::--check did not detect a stale version"; exit 1; }
          rm -rf "$tmp"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The pages leave the repository with the last release known at commit
      # time. Ask GitHub for the current one and write it in before uploading,
      # so a browser that cannot reach the API still sees a recent version.
      # When this lookup fails, the committed value stays: a stale number is
      # better than a missed deploy.
      - name: Stamp the latest Ptah release into the pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="$(gh api repos/stokaro/ptah/releases/latest --jq .tag_name 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "::warning::could not read the latest stokaro/ptah release; keeping the committed version"
            exit 0
          fi
          node scripts/stamp-version.mjs "$tag"

      # https://ptah.run/install.sh and /install.ps1 are the installers from the
      # master branch of stokaro/ptah (docs/site/public/). They are not kept in
      # this repository: every deploy fetches them, so the site never serves a
      # copy that drifted from the source. A failed fetch fails the deploy and
      # leaves the previous deployment, installers included, in place.
      - name: Fetch the installers from stokaro/ptah master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in install.sh install.ps1; do
            gh api "repos/stokaro/ptah/contents/docs/site/public/$f?ref=master" \
              -H "Accept: application/vnd.github.raw+json" > "$f"
            test "$(wc -c < "$f")" -gt 4096
            grep -q "PTAH_INSTALL" "$f"
          done
          head -1 install.sh | grep -qx '#!/bin/sh'
          sh -n install.sh
          ls -la install.sh install.ps1

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
